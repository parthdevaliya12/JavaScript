<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- Primary SEO -->
    <title>FRAME. | Discover Extraordinary Photography</title>

    <meta
      name="description"
      content="Discover extraordinary photography with FRAME. Explore stunning images, find creative inspiration, and browse a cinematic collection of visual stories."
    />

    <meta
      name="keywords"
      content="FRAME, photography gallery, image search, Unsplash images, visual inspiration, photography discovery, free photos"
    />

    <meta name="author" content="Parth Devaliya" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="FRAME." />

    <!-- Canonical URL: replace with your actual deployed domain -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Favicon and browser tab logo -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Optional web app manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Performance: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph: Facebook, LinkedIn, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FRAME." />
    <meta
      property="og:title"
      content="FRAME. | Discover Extraordinary Photography"
    />
    <meta
      property="og:description"
      content="Explore beautiful photography, discover fresh inspiration, and find your next visual story."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:image"
      content="https://your-domain.com/social-preview.jpg"
    />
    <meta
      property="og:image:alt"
      content="FRAME — a cinematic black-and-white photography discovery gallery"
    />

    <!-- Twitter / X sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FRAME. | Discover Extraordinary Photography"
    />
    <meta
      name="twitter:description"
      content="A cinematic space for discovering extraordinary photography and visual inspiration."
    />
    <meta
      name="twitter:image"
      content="https://your-domain.com/social-preview.jpg"
    />

    <!-- Search engine appearance -->
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
